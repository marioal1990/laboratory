spring.application.name=laboratory
spring.main.banner-mode=off
spring.devtools.livereload.enabled=true
server.port=8888
server.servlet.context-path=/laboratory
spring.main.allow-bean-definition-overriding=true

#MySQL CONNECTION
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#H2 CONNECTION
#spring.datasource.url=jdbc:h2:mem:db_docker
#spring.datasource.driver-class-name=org.h2.Driver
#spring.jpa.hibernate.ddl-auto=update

#REST MS-PRODUCTOS
msproductos.url.host=http://localhost:8889/ms-productos
msproductos.url.get.getList=/api/v1/producto/productos

logging.level.web=error
